<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capacitación - Plataforma Psicoeducativa</title>
  <script src="/src/js/data/sync-store.js"></script>
  <link rel="stylesheet" href="/src/css/main.css">
  <style>
    .cap { display: flex; flex-direction: column; height: 100vh; padding-top: 28px; background: #F2F2F7; }
    .tabs { display: flex; background: white; border-bottom: 1px solid #E5E5EA; overflow-x: auto; }
    .tab { flex: 1; min-width: fit-content; padding: 14px 16px; text-align: center; font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
    .tab--active { border-bottom-color: #007AFF; color: #007AFF; font-weight: 600; }
    .content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 100px; }
    
    /* Featured Banner */
    .featured { background: linear-gradient(135deg,#1a1a2e,#16213e); border-radius: 16px; padding: 20px; color: white; margin-bottom: 20px; }
    .featured-label { font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .featured-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .featured-desc { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 16px; line-height: 1.4; }
    .featured-btn { padding: 10px 20px; background: #007AFF; color: white; border-radius: 9999px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .featured-btn:hover { opacity: 0.9; }
    
    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 20px; }
    .stat { background: white; border-radius: 12px; padding: 16px 8px; text-align: center; }
    .stat-value { font-size: 20px; font-weight: 700; color: #007AFF; }
    .stat-label { font-size: 11px; color: #8E8E93; margin-top: 4px; }
    
    /* Section */
    .section-title { font-size: 18px; font-weight: 600; margin-bottom: 12px; }
    
    /* Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(140px,1fr)); gap: 12px; }
    
    /* Card */
    .card { background: white; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s; position: relative; }
    .card:hover { transform: scale(1.02); }
    .card-img { height: 120px; background: linear-gradient(135deg,#007AFF,#5856D6); display: flex; align-items: center; justify-content: center; font-size: 36px; }
    .card-body { padding: 12px; }
    .card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; line-height: 1.2; }
    .card-meta { font-size: 12px; color: #8E8E93; margin-bottom: 8px; }
    .card-badge { display: inline-block; padding: 2px 8px; background: rgba(0,122,255,0.1); color: #007AFF; border-radius: 4px; font-size: 11px; font-weight: 500; margin-top: 4px; }
    
    /* Buttons */
    .card-btn { display: block; width: 100%; padding: 8px; text-align: center; font-size: 13px; font-weight: 600; border: none; cursor: pointer; border-radius: 0 0 12px 12px; transition: all 0.3s; }
    .card-btn--get { background: rgba(0,122,255,0.1); color: #007AFF; }
    .card-btn--get:hover { background: rgba(0,122,255,0.2); }
    .card-btn--open { background: #E5E5EA; color: #1C1C1E; }
    .card-btn--open:hover { background: #D1D1D6; }
    .card-btn--progress { background: rgba(52,199,89,0.1); color: #34C759; }
    
    /* Progress Circle */
    .progress-circle { width: 24px; height: 24px; border-radius: 50%; border: 3px solid #E5E5EA; border-top-color: #34C759; display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-circle--done { border-color: #34C759; animation: none; }
    
    /* Progress Bar */
    .progress-bar-container { width: 100%; height: 4px; background: #E5E5EA; border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: #34C759; border-radius: 2px; transition: width 0.3s; }
    
    /* Workshop Item */
    .workshop-item { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .workshop-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .workshop-detail { font-size: 13px; color: #8E8E93; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .workshop-detail svg { width: 16px; height: 16px; fill: #8E8E93; }
    .workshop-btn { margin-top: 12px; padding: 10px 20px; background: #007AFF; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; transition: opacity 0.2s; }
    .workshop-btn:hover { opacity: 0.9; }
    .workshop-btn:disabled { background: #E5E5EA; color: #8E8E93; cursor: not-allowed; }
    
    /* Certification Item */
    .cert-item { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 16px; }
    .cert-icon { width: 50px; height: 50px; background: linear-gradient(135deg,#FFD700,#FFA500); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .cert-body { flex: 1; }
    .cert-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .cert-date { font-size: 13px; color: #8E8E93; }
    .cert-btn { padding: 8px 16px; background: rgba(0,122,255,0.1); color: #007AFF; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .cert-btn:hover { background: rgba(0,122,255,0.2); }
    
    /* My Courses */
    .my-course-item { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .my-course-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .my-course-emoji { width: 40px; height: 40px; background: linear-gradient(135deg,#007AFF,#5856D6); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .my-course-info { flex: 1; }
    .my-course-title { font-size: 15px; font-weight: 600; }
    .my-course-meta { font-size: 12px; color: #8E8E93; }
    .my-course-btn { padding: 8px 16px; background: #007AFF; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .my-course-btn:hover { opacity: 0.9; }
  </style>
</head>

  <script>
    // ============================================
    // DATOS DE CURSOS, TALLERES Y CERTIFICACIONES
    // ============================================
    const cursos = [
      {id:1, nombre:'Inteligencia Emocional', emoji:'🧠', duracion:'2h', categoria:'Psicología', status:'progress', progress:60, lessons:3, total:5},
      {id:2, nombre:'Manejo de Conflictos', emoji:'🤝', duracion:'3h', categoria:'Pedagogía', status:'progress', progress:50, lessons:2, total:4},
      {id:3, nombre:'Comunicación Asertiva', emoji:'🗣️', duracion:'2h', categoria:'Comunicación', status:'completed', lessons:4, total:4, date:'15/03/2026'},
      {id:4, nombre:'Resiliencia', emoji:'💪', duracion:'2h', categoria:'Bienestar', status:'available'},
      {id:5, nombre:'Prevención de Acoso', emoji:'🛡️', duracion:'3h', categoria:'Prevención', status:'available'},
      {id:6, nombre:'Educación Sexual', emoji:'📚', duracion:'4h', categoria:'Psicología', status:'available'},
      {id:7, nombre:'Primeros Auxilios Psicológicos', emoji:'🏥', duracion:'4h', categoria:'Psicología', status:'available'},
      {id:8, nombre:'Mindfulness', emoji:'🧘', duracion:'1.5h', categoria:'Bienestar', status:'available'},
    ];

    const talleres = [
      {id:1, nombre:'Taller de Inteligencia Emocional', fecha:'15/05/2026', duracion:'3h', psi:'Dra. García', cupo:20, inscrito:false},
      {id:2, nombre:'Prevención del Suicidio', fecha:'20/05/2026', duracion:'4h', psi:'Dr. Pérez', cupo:15, inscrito:false},
    ];

    const certificaciones = [
      {id:1, nombre:'Comunicación Asertiva', fecha:'15/03/2026', emoji:'🎓'},
      {id:2, nombre:'Primeros Auxilios Psicológicos', fecha:'01/02/2026', emoji:'🏥'},
    ];

    // Estado de cursos del usuario
    const userCourses = {
      'Inteligencia Emocional': {status: 'progress', progress: 60, lessons: 3, total: 5},
      'Manejo de Conflictos': {status: 'progress', progress: 50, lessons: 2, total: 4},
      'Comunicación Asertiva': {status: 'completed', lessons: 4, total: 4, date: '15/03/2026'},
    };

    // ============================================
    // ESTADÍSTICAS DINÁMICAS
    // ============================================
    function getStats() {
      const completed = Object.values(userCourses).filter(c => c.status === 'completed').length;
      const inProgress = Object.values(userCourses).filter(c => c.status === 'progress').length;
      const totalHours = cursos.filter(c => userCourses[c.nombre]).reduce((acc, c) => {
        const hours = parseFloat(c.duracion);
        return acc + hours;
      }, 0);
      const certCount = certificaciones.length;
      const streak = 7; // Simulado
      
      return { completed, inProgress, totalHours, certCount, streak };
    }

    // ============================================
    // RENDERIZADO POR TAB
    // ============================================
    function renderHoy() {
      const stats = getStats();
      return `
        <div class="featured">
          <div class="featured-label">DESTACADO</div>
          <div class="featured-title">Inteligencia Emocional en el Aula</div>
          <div class="featured-desc">Aprende a identificar y gestionar emociones en estudiantes para crear un ambiente de aprendizaje positivo</div>
          <button class="featured-btn" onclick="alert('Abriendo curso...')">Ver Curso</button>
        </div>
        
        <div class="stats">
          <div class="stat"><div class="stat-value">${stats.completed + stats.inProgress}</div><div class="stat-label">Cursos</div></div>
          <div class="stat"><div class="stat-value">${stats.totalHours}h</div><div class="stat-label">Aprend.</div></div>
          <div class="stat"><div class="stat-value">${stats.certCount}</div><div class="stat-label">Certif.</div></div>
          <div class="stat"><div class="stat-value">${stats.streak}</div><div class="stat-label">Racha</div></div>
        </div>
        
        <div class="section-title">Cursos Recomendados para Ti</div>
        <div class="grid">
          ${cursos.filter(c => c.status === 'available').slice(0, 3).map(curso => `
            <div class="card" onclick="openCurso('${curso.nombre}')">
              <div class="card-img" style="background:linear-gradient(135deg,#007AFF,#5856D6)">${curso.emoji}</div>
              <div class="card-body">
                <div class="card-title">${curso.nombre}</div>
                <div class="card-meta">${curso.duracion}</div>
                <span class="card-badge">${curso.categoria}</span>
              </div>
              <button class="card-btn card-btn--get" onclick="event.stopPropagation(); obtenerCurso(${curso.id}, '${curso.nombre}')">Obtener</button>
            </div>
          `).join('')}
        </div>
        
        <div class="section-title" style="margin-top:20px">Continuar Aprendiendo</div>
        <div class="grid">
          ${cursos.filter(c => c.status === 'progress').map(curso => `
            <div class="card" onclick="openCurso('${curso.nombre}')">
              <div class="card-img" style="background:linear-gradient(135deg,#34C759,#30D158)">${curso.emoji}</div>
              <div class="card-body">
                <div class="card-title">${curso.nombre}</div>
                <div class="card-meta">${curso.lessons}/${curso.total} módulos • ${curso.progress}%</div>
                <div class="progress-bar-container"><div class="progress-bar-fill" style="width:${curso.progress}%"></div></div>
              </div>
              <button class="card-btn card-btn--open" onclick="event.stopPropagation(); openCurso('${curso.nombre}')">Continuar</button>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderCursos() {
      const categories = ['Psicología', 'Pedagogía', 'Liderazgo', 'Bienestar', 'Prevención'];
      return `
        ${categories.map(cat => {
          const cursosEnCat = cursos.filter(c => c.categoria === cat);
          if (cursosEnCat.length === 0) return '';
          return `
            <div class="section-title" style="margin-top:${cat === categories[0] ? '0' : '20px'}">${cat}</div>
            <div class="grid">
              ${cursosEnCat.map(curso => `
                <div class="card" onclick="openCurso('${curso.nombre}')">
                  <div class="card-img" style="background:${getGradient(curso.categoria)}">${curso.emoji}</div>
                  <div class="card-body">
                    <div class="card-title">${curso.nombre}</div>
                    <div class="card-meta">${curso.duracion}</div>
                    <span class="card-badge">${curso.categoria}</span>
                    ${curso.status === 'progress' ? `<div class="progress-bar-container"><div class="progress-bar-fill" style="width:${curso.progress}%"></div></div>` : ''}
                  </div>
                  ${getCursoButton(curso)}
                </div>
              `).join('')}
            </div>
          `;
        }).join('')}
      `;
    }

    function renderTalleres() {
      return `
        <div class="section-title">Talleres Disponibles</div>
        ${talleres.map(t => `
          <div class="workshop-item">
            <div class="workshop-title">${t.nombre}</div>
            <div class="workshop-detail">
              <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
              ${t.fecha} • ${t.duracion}
            </div>
            <div class="workshop-detail">
              <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
              ${t.psi}
            </div>
            <div class="workshop-detail">
              <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
              Cupo: ${t.cupo} disponibles
            </div>
            <button class="workshop-btn" onclick="inscribirseTaller(${t.id})" ${t.inscrito ? 'disabled' : ''}>
              ${t.inscrito ? 'Inscrito' : 'Inscribirse'}
            </button>
          </div>
        `).join('')}
      `;
    }

    function renderCertificaciones() {
      return `
        <div class="section-title">Mis Certificaciones</div>
        ${certificaciones.map(cert => `
          <div class="cert-item">
            <div class="cert-icon">${cert.emoji}</div>
            <div class="cert-body">
              <div class="cert-title">${cert.nombre}</div>
              <div class="cert-date">Obtenido: ${cert.fecha}</div>
            </div>
            <button class="cert-btn" onclick="descargarCertificado('${cert.nombre}')">Descargar PDF</button>
          </div>
        `).join('')}
      `;
    }

    function renderMisCursos() {
      const enProgreso = cursos.filter(c => c.status === 'progress');
      const completados = cursos.filter(c => c.status === 'completed');
      
      return `
        <div class="section-title">En Progreso</div>
        ${enProgreso.length > 0 ? enProgreso.map(curso => `
          <div class="my-course-item">
            <div class="my-course-header">
              <div class="my-course-emoji">${curso.emoji}</div>
              <div class="my-course-info">
                <div class="my-course-title">${curso.nombre}</div>
                <div class="my-course-meta">${curso.lessons}/${curso.total} módulos • ${curso.progress}%</div>
              </div>
              <button class="my-course-btn" onclick="openCurso('${curso.nombre}')">Continuar</button>
            </div>
            <div class="progress-bar-container"><div class="progress-bar-fill" style="width:${curso.progress}%"></div></div>
          </div>
        `).join('') : '<p style="color:#8E8E93;font-size:14px;">No tienes cursos en progreso.</p>'}
        
        <div class="section-title" style="margin-top:20px">Completados</div>
        ${completados.length > 0 ? completados.map(curso => `
          <div class="my-course-item">
            <div class="my-course-header">
              <div class="my-course-emoji" style="background:linear-gradient(135deg,#34C759,#30D158)">${curso.emoji}</div>
              <div class="my-course-info">
                <div class="my-course-title">${curso.nombre}</div>
                <div class="my-course-meta">Completado • ${curso.date || ''}</div>
              </div>
              <button class="my-course-btn" onclick="openCurso('${curso.nombre}')">Repasar</button>
            </div>
          </div>
        `).join('') : '<p style="color:#8E8E93;font-size:14px;">No tienes cursos completados.</p>'}
      `;
    }

    // ============================================
    // HELPERS
    // ============================================
    function getGradient(categoria) {
      const gradients = {
        'Psicología': 'linear-gradient(135deg,#5856D6,#AF52DE)',
        'Pedagogía': 'linear-gradient(135deg,#007AFF,#5856D6)',
        'Liderazgo': 'linear-gradient(135deg,#FF9500,#FF9F0A)',
        'Bienestar': 'linear-gradient(135deg,#34C759,#30D158)',
        'Prevención': 'linear-gradient(135deg,#FF3B30,#FF453A)',
        'Comunicación': 'linear-gradient(135deg,#5AC8FA,#64D2FF)',
      };
      return gradients[categoria] || 'linear-gradient(135deg,#007AFF,#5856D6)';
    }

    function getCursoButton(curso) {
      if (curso.status === 'completed') {
        return `<button class="card-btn card-btn--open" onclick="event.stopPropagation(); openCurso('${curso.nombre}')">Repasar</button>`;
      } else if (curso.status === 'progress') {
        return `<button class="card-btn card-btn--progress" onclick="event.stopPropagation(); openCurso('${curso.nombre}')">Abrir</button>`;
      } else {
        return `<button class="card-btn card-btn--get" onclick="event.stopPropagation(); obtenerCurso(${curso.id}, '${curso.nombre}')">Obtener</button>`;
      }
    }

    // ============================================
    // ACCIONES
    // ============================================
    function obtenerCurso(id, nombre) {
      // Simular descarga
      const curso = cursos.find(c => c.id === id);
      if (!curso) return;
      
      // Cambiar estado a progreso
      curso.status = 'progress';
      curso.progress = 0;
      curso.lessons = 0;
      
      // Agregar a userCourses
      userCourses[nombre] = {status: 'progress', progress: 0, lessons: 0, total: curso.total};
      
      // Animar progreso
      const interval = setInterval(() => {
        curso.progress += 10;
        if (curso.progress >= 100) {
          curso.progress = 100;
          curso.status = 'completed';
          curso.lessons = curso.total;
          userCourses[nombre].status = 'completed';
          userCourses[nombre].progress = 100;
          userCourses[nombre].lessons = curso.total;
          clearInterval(interval);
        }
        // Re-render current tab
        const activeTab = document.querySelector('.tab--active');
        if (activeTab) switchTab(activeTab.dataset.tab);
      }, 200);
      
      alert(`Descargando "${nombre}"...`);
    }

    function openCurso(nombre) {
      alert(`Abriendo curso: ${nombre}`);
    }

    function inscribirseTaller(id) {
      const taller = talleres.find(t => t.id === id);
      if (!taller) return;
      
      taller.inscrito = true;
      alert(`Te has inscrito en: ${taller.nombre}`);
      
      // Re-render current tab
      const activeTab = document.querySelector('.tab--active');
      if (activeTab) switchTab(activeTab.dataset.tab);
    }

    function descargarCertificado(nombre) {
      alert(`Descargando certificado: ${nombre}\n(En una implementación real, esto generaría un PDF)`);
    }

    // ============================================
    // TAB SWITCHING
    // ============================================
    function switchTab(tabName) {
      const content = document.getElementById('content');
      switch(tabName) {
        case 'hoy':
          content.innerHTML = renderHoy();
          break;
        case 'cursos':
          content.innerHTML = renderCursos();
          break;
        case 'talleres':
          content.innerHTML = renderTalleres();
          break;
        case 'certificaciones':
          content.innerHTML = renderCertificaciones();
          break;
        case 'mis-cursos':
          content.innerHTML = renderMisCursos();
          break;
      }
    }

    // ============================================
    // INIT
    // ============================================
    function logout() {
      syncStore.clear();
      window.location.href = '../login.html';
    }

    function navigateTo(p) {
      window.location.href = p;
    }

    // Actualizar fecha del icono de agenda
    function updateCalendarIcon() {
      const now = new Date();
      const dayNameOptions = { weekday: 'short' };
      let dayName = now.toLocaleDateString('es-ES', dayNameOptions).toUpperCase();
      dayName = dayName.replace('.', ''); 
      const dayNumber = now.getDate();
      
      const dayNameEl = document.getElementById('day-name');
      const dayNumberEl = document.getElementById('day-number');
      if (dayNameEl) dayNameEl.textContent = dayName;
      if (dayNumberEl) dayNumberEl.textContent = dayNumber;
    }
    
    // Ejecutar al cargar
    updateCalendarIcon();

document.addEventListener('DOMContentLoaded', () => {
      // Check auth
      if (syncStore.get('logged') !== 'true') {
window.location.href = '../login.html';
        return;
      }

      // Set user avatar
      const usuario = syncStore.get('usuario') || 'U';
      document.getElementById('user-avatar').textContent = usuario.split(' ').map(n => n[0]).join('').substring(0, 2);

      // Logout button
      document.getElementById('logout-btn').addEventListener('click', logout);

      // Dock navigation
      document.querySelectorAll('.dock__icon').forEach(i => {
        i.addEventListener('click', () => navigateTo(i.dataset.href));
      });

      // Tab switching
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', function() {
          document.querySelectorAll('.tab').forEach(x => x.classList.remove('tab--active'));
          this.classList.add('tab--active');
          switchTab(this.dataset.tab);
        });
      });

      // Clock
      setInterval(() => {
        document.getElementById('clock').textContent = new Date().toLocaleTimeString('es-MX', {hour: '2-digit', minute: '2-digit'});
      }, 1000);

      // Initial render
      switchTab('hoy');
    });
  </script>
</body>
</html>
