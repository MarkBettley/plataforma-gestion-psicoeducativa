<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Plataforma Psicoeducativa</title>
  <script src="/src/js/data/sync-store.js"></script>
  <link rel="stylesheet" href="/src/css/main.css">
  <style>
    .chat { display: flex; height: 100vh; padding-top: 28px; background: #F2F2F7; }
    .sidebar { width: 280px; background: white; border-right: 1px solid #E5E5EA; display: flex; flex-direction: column; }
    .search { padding: 12px; }
    .search input { width: 100%; padding: 10px 14px; border-radius: 9999px; background: #E5E5EA; border: none; font-size: 15px; }
    .tabs { display: flex; border-bottom: 1px solid #E5E5EA; }
    .tab { flex: 1; padding: 12px; text-align: center; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab--active { border-bottom-color: #007AFF; color: #007AFF; }
    .list { flex: 1; overflow-y: auto; }
    .item { display: flex; align-items: center; gap: 12px; padding: 12px; cursor: pointer; }
    .item:hover { background: rgba(0,0,0,0.03); }
    .item--active { background: rgba(0,122,255,0.1); }
    .avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg,#5856D6,#AF52DE); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; position: relative; }
    .online { position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; background: #34C759; border-radius: 50%; border: 2px solid white; }
    .info { flex: 1; overflow: hidden; }
    .name { font-weight: 500; font-size: 14px; }
    .msg { font-size: 12px; color: #8E8E93; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .time { font-size: 11px; color: #8E8E93; }
    .main { flex: 1; display: flex; flex-direction: column; background: white; }
    .header { padding: 12px 16px; border-bottom: 1px solid #E5E5EA; display: flex; align-items: center; gap: 12px; }
    .header-title { font-size: 16px; font-weight: 600; }
    .header-status { font-size: 12px; color: #34C759; }
    .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 18px; font-size: 14px; }
    .msg--sent { align-self: flex-end; background: #007AFF; color: white; }
    .msg--received { align-self: flex-start; background: #E5E5EA; }
    .input { padding: 12px 16px; border-top: 1px solid #E5E5EA; display: flex; gap: 8px; }
    .input input { flex: 1; padding: 10px 14px; border-radius: 9999px; background: #E5E5EA; border: none; font-size: 14px; }
    .input button { width: 36px; height: 36px; border-radius: 50%; background: #007AFF; border: none; color: white; cursor: pointer; }
  </style>
</head>

        <div class="msg msg--sent">Los directivos están muy contentos</div>
        <div class="msg msg--received">Excelente!</div>
      </div>
      <div class="input"><input type="text" placeholder="Mensaje..."><button>➤</button></div>
    </section>

  <script>
    // Datos de ejemplo
    const contactos = [
      {id:1, nombre:'Dr. Juan Pérez', avatar:'JP', online:true, tipo:'individual', ultimoMsg:'Hola!', hora:'10:15'},
      {id:2, nombre:'Dra. María García', avatar:'MG', online:false, tipo:'individual', ultimoMsg:'OK', hora:'9:30'},
      {id:3, nombre:'Equipo Pachuca I', avatar:'EP', online:true, tipo:'grupo', ultimoMsg:'Reunión a las 3pm', hora:'8:00'},
      {id:4, nombre:'Mtra. Ana Torres', avatar:'AT', online:true, tipo:'individual', ultimoMsg:'El taller fue exitoso', hora:'Ayer'},
    ];

    const canales = [
      {id:1, nombre:'Anuncios Oficiales', tipo:'canal', ultimoMsg:'Nueva circular disponible', hora:'Hoy'},
      {id:2, nombre:'Pachuca I', tipo:'regional', ultimoMsg:'Reporte semanal', hora:'Ayer'},
      {id:3, nombre:'Psicólogos', tipo:'grupo', ultimoMsg:'Compartan materiales', hora:'Ayer'},
    ];

    const mensajes = {
      1: [
        {de:'ellos', texto:'Hola! ¿Cómo va la visita?', hora:'10:00'},
        {de:'yo', texto:'Muy bien! Ya estamos en la segunda ronda', hora:'10:05'},
        {de:'ellos', texto:'Excelente!', hora:'10:15'}
      ],
      2: [
        {de:'ellos', texto:'¿Lista la documentación?', hora:'9:00'},
        {de:'yo', texto:'Sí, ya la envié', hora:'9:15'},
        {de:'ellos', texto:'OK', hora:'9:30'}
      ],
      3: [
        {de:'ellos', texto:'Reunión a las 3pm', hora:'8:00'}
      ],
      4: [
        {de:'ellos', texto:'El taller fue exitoso', hora:'Ayer'}
      ],
      101: [ // Anuncios Oficiales
        {de:'ellos', texto:'Nueva circular disponible', hora:'Hoy'}
      ],
      102: [ // Pachuca I regional
        {de:'ellos', texto:'Reporte semanal', hora:'Ayer'}
      ],
      103: [ // Psicólogos grupo
        {de:'ellos', texto:'Compartan materiales', hora:'Ayer'}
      ]
    };

    let currentTab = 'chats';
    let selectedContactId = 1;
    let selectedCanalId = null;

    function logout(){syncStore.clear();window.location.href='../login.html';}
    function navigateTo(p){window.location.href=p;}

    function renderContacts(lista) {
      const container = document.getElementById('list-container');
      container.innerHTML = '';
      lista.forEach(c => {
        const div = document.createElement('div');
        div.className = 'item' + (c.id === selectedContactId ? ' item--active' : '');
        div.dataset.id = c.id;
        div.innerHTML = `
          <div class="avatar" style="background:linear-gradient(135deg,#5856D6,#AF52DE)">${c.avatar}${c.online?'<div class="online"></div>':''}</div>
          <div class="info"><div class="name">${c.nombre}</div><div class="msg">${c.ultimoMsg}</div></div>
          <div class="time">${c.hora}</div>
        `;
        div.addEventListener('click', () => selectContact(c.id));
        container.appendChild(div);
      });
    }

    function renderCanales() {
      const container = document.getElementById('list-container');
      container.innerHTML = '';
      canales.forEach(c => {
        const div = document.createElement('div');
        div.className = 'item' + (c.id === selectedCanalId ? ' item--active' : '');
        div.dataset.id = c.id;
        div.innerHTML = `
          <div class="avatar" style="background:linear-gradient(135deg,#FF9500,#FF9F0A)">${c.nombre.substring(0,2)}</div>
          <div class="info"><div class="name">${c.nombre}</div><div class="msg">${c.ultimoMsg}</div></div>
          <div class="time">${c.hora}</div>
        `;
        div.addEventListener('click', () => selectCanal(c.id));
        container.appendChild(div);
      });
    }

    function selectCanal(id) {
      selectedCanalId = id;
      const canal = canales.find(c => c.id === id);
      if (!canal) return;

      document.querySelectorAll('.item').forEach(x => x.classList.remove('item--active'));
      const activeItem = document.querySelector(`.item[data-id="${id}"]`);
      if (activeItem) activeItem.classList.add('item--active');

      document.querySelector('.header-title').textContent = canal.nombre;
      document.querySelector('.header-status').textContent = canal.tipo === 'canal' ? 'Canal oficial' : (canal.tipo === 'regional' ? 'chat grupal' : 'Grupo');
      document.querySelector('.header .avatar').innerHTML = canal.nombre.substring(0,2) + '<div class="online"></div>';

      renderMessages(id + 100); // offset para canales
    }

    function selectContact(id) {
      selectedContactId = id;
      const contacto = contactos.find(c => c.id === id);
      if (!contacto) return;

      document.querySelectorAll('.item').forEach(x => x.classList.remove('item--active'));
      const activeItem = document.querySelector(`.item[data-id="${id}"]`);
      if (activeItem) activeItem.classList.add('item--active');

      document.querySelector('.header-title').textContent = contacto.nombre;
      document.querySelector('.header-status').textContent = contacto.online ? 'En línea' : 'Desconectado';
      document.querySelector('.header .avatar').innerHTML = contacto.avatar + (contacto.online?'<div class="online"></div>':'');

      renderMessages(id);
    }

    function renderMessages(contactId) {
      const messagesDiv = document.querySelector('.messages');
      messagesDiv.innerHTML = '';
      const msgs = mensajes[contactId] || [];
      msgs.forEach(m => {
        const div = document.createElement('div');
        div.className = 'msg ' + (m.de === 'yo' ? 'msg--sent' : 'msg--received');
        div.textContent = m.texto;
        messagesDiv.appendChild(div);
      });
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function sendMessage() {
      const input = document.querySelector('.input input');
      const texto = input.value.trim();
      if (!texto || !selectedContactId) return;

      if (!mensajes[selectedContactId]) mensajes[selectedContactId] = [];

      const hora = new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
      mensajes[selectedContactId].push({de:'yo', texto, hora});

      renderMessages(selectedContactId);
      input.value = '';

      // Simular respuesta después de 2 segundos
      setTimeout(() => {
        mensajes[selectedContactId].push({de:'ellos', texto:'Recibido', hora: new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})});
        renderMessages(selectedContactId);
      }, 2000);
    }

    // Actualizar fecha del icono de agenda
    function updateCalendarIcon() {
      const now = new Date();
      const dayNameOptions = { weekday: 'short' };
      let dayName = now.toLocaleDateString('es-ES', dayNameOptions).toUpperCase();
      dayName = dayName.replace('.', ''); 
      const dayNumber = now.getDate();
      
      const dayNameEl = document.getElementById('day-name');
      const dayNumberEl = document.getElementById('day-number');
      if (dayNameEl) dayNameEl.textContent = dayName;
      if (dayNumberEl) dayNumberEl.textContent = dayNumber;
    }
    
    // Ejecutar al cargar
    updateCalendarIcon();

    document.addEventListener('DOMContentLoaded',()=>{
      if(syncStore.get('logged')!=='true'){window.location.href='../login.html';return;}

      document.getElementById('user-avatar').textContent=(syncStore.get('usuario')||'U').split(' ').map(n=>n[0]).join('').substring(0,2);
      document.getElementById('logout-btn').addEventListener('click',logout);
      document.querySelectorAll('.dock__icon').forEach(i=>i.addEventListener('click',()=>navigateTo(i.dataset.href)));

      // Tabs
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('tab--active'));
          tab.classList.add('tab--active');
          currentTab = tab.dataset.tab;
          if (currentTab === 'chats') {
            renderContacts(contactos);
            if (contactos.length > 0) selectContact(contactos[0].id);
          } else {
            renderCanales();
          }
        });
      });

      // Búsqueda
      document.getElementById('search-input').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        if (currentTab === 'chats') {
          const filtrados = contactos.filter(c => c.nombre.toLowerCase().includes(q));
          renderContacts(filtrados);
        } else {
          const filtrados = canales.filter(c => c.nombre.toLowerCase().includes(q));
          renderCanalesFiltrados(filtrados);
        }
      });

      function renderCanalesFiltrados(lista) {
        const container = document.getElementById('list-container');
        container.innerHTML = '';
        lista.forEach(c => {
          const div = document.createElement('div');
          div.className = 'item' + (c.id === selectedCanalId ? ' item--active' : '');
          div.dataset.id = c.id;
          div.innerHTML = `
            <div class="avatar" style="background:linear-gradient(135deg,#FF9500,#FF9F0A)">${c.nombre.substring(0,2)}</div>
            <div class="info"><div class="name">${c.nombre}</div><div class="msg">${c.ultimoMsg}</div></div>
            <div class="time">${c.hora}</div>
          `;
          div.addEventListener('click', () => selectCanal(c.id));
          container.appendChild(div);
        });
      }

      // Enviar mensaje
      document.querySelector('.input button').addEventListener('click', sendMessage);
      document.querySelector('.input input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
      });

      // Reloj
      setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}),1000);

      // Inicializar
      renderContacts(contactos);
      selectContact(selectedContactId);
    });
  </script>
</body>
