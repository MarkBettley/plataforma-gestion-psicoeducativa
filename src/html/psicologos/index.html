<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Psicologos - Plataforma Psicoeducativa</title>
  <link rel="stylesheet" href="/src/css/main.css">
  <script src="/src/js/data/sync-store.js"></script>
  <style>
    .page { display: flex; height: 100vh; padding-top: 28px; background: #F2F2F7; }
    
    /* Sidebar */
    .sidebar { 
      width: 280px; 
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-right: 1px solid #E5E5EA; 
      overflow-y: auto; 
      display: flex;
      flex-direction: column;
    }
    .search { padding: 12px; }
    .search input { 
      width: 100%; 
      padding: 10px 14px; 
      border-radius: 9999px; 
      background: #E5E5EA; 
      border: none; 
      font-size: 15px;
      outline: none;
    }
    .search input:focus { background: #D1D1D6; }
    .filters { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 8px; 
      padding: 0 12px 12px; 
      border-bottom: 1px solid #E5E5EA;
    }
    .filter { 
      padding: 6px 12px; 
      border-radius: 9999px; 
      font-size: 12px; 
      background: #E5E5EA; 
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter:hover { background: #D1D1D6; }
    .filter--active { background: #007AFF; color: white; }
    
    /* Team section */
    .team-section {
      padding: 12px;
      border-bottom: 1px solid #E5E5EA;
    }
    .team-title {
      font-size: 11px;
      font-weight: 600;
      color: #8E8E93;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .team-list { display: flex; flex-direction: column; gap: 2px; }
    .team-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .team-item:hover { background: rgba(0,0,0,0.05); }
    .team-item--active { background: rgba(0,122,255,0.1); color: #007AFF; }
    .team-count {
      margin-left: auto;
      font-size: 11px;
      color: #8E8E93;
      background: #E5E5EA;
      padding: 2px 6px;
      border-radius: 9999px;
    }
    
    /* List */
    .list { flex: 1; overflow-y: auto; }
    .section { font-size: 12px; font-weight: 600; color: #8E8E93; padding: 12px 12px 8px; text-transform: uppercase; }
    .item { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      padding: 12px; 
      border-radius: 8px; 
      cursor: pointer; 
    }
    .item:hover { background: rgba(0,0,0,0.05); }
    .item--active { background: rgba(0,122,255,0.1); }
    .avatar { 
      width: 44px; 
      height: 44px; 
      border-radius: 50%; 
      background: linear-gradient(135deg,#007AFF,#5856D6); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      color: white; 
      font-weight: 600; 
      font-size: 14px; 
      position: relative; 
    }
    .status { 
      position: absolute; 
      bottom: 0; 
      right: 0; 
      width: 10px; 
      height: 10px; 
      border-radius: 50%; 
      border: 2px solid white; 
    }
    .status--online { background: #34C759; }
    .status--away { background: #FFCC00; }
    .status--offline { background: #8E8E93; }
    .info { flex: 1; }
    .name { font-weight: 500; font-size: 14px; }
    .specialty { font-size: 12px; color: #8E8E93; }
    
    /* Main content */
    .main { 
      flex: 1; 
      padding: 24px; 
      overflow-y: auto; 
      background: white; 
    }
    .header { display: flex; gap: 20px; margin-bottom: 24px; align-items: center; }
    .avatar-lg { 
      width: 100px; 
      height: 100px; 
      border-radius: 50%; 
      background: linear-gradient(135deg,#007AFF,#5856D6); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      color: white; 
      font-weight: 700; 
      font-size: 32px; 
    }
    .header-info { flex: 1; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 15px; color: #8E8E93; margin-top: 4px; }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      margin-top: 8px;
    }
    .status-badge--online { background: rgba(52,199,89,0.1); color: #34C759; }
    .status-badge--away { background: rgba(255,204,0,0.1); color: #FFCC00; }
    .status-badge--offline { background: rgba(142,142,147,0.1); color: #8E8E93; }
    
    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 24px; }
    .stat { background: #F2F2F7; border-radius: 12px; padding: 16px; text-align: center; }
    .stat-value { font-size: 24px; font-weight: 700; color: #007AFF; }
    .stat-label { font-size: 12px; color: #8E8E93; margin-top: 4px; }
    
    /* Cards */
    .card { background: #F2F2F7; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .card-title { font-size: 13px; font-weight: 600; color: #8E8E93; margin-bottom: 12px; text-transform: uppercase; }
    .card-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #E5E5EA; }
    .card-row:last-child { border-bottom: none; }
    .card-label { color: #8E8E93; font-size: 14px; }
    .card-value { font-weight: 500; font-size: 14px; }
    
    /* Gamification */
    .gamification { display: flex; gap: 12px; margin-top: 16px; }
    .gamification__item {
      flex: 1;
      background: linear-gradient(135deg,#5856D6,#AF52DE);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      color: white;
    }
    .gamification__value { font-size: 18px; font-weight: 700; }
    .gamification__label { font-size: 11px; opacity: 0.8; }
    
    /* Actions */
    .actions { display: flex; gap: 12px; margin-top: 24px; }
    .btn { padding: 12px 24px; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; }
    .btn:hover { transform: scale(1.02); opacity: 0.9; }
    .btn:active { transform: scale(0.98); }
    .btn--primary { background: #007AFF; color: white; }
    .btn--secondary { background: #E5E5EA; color: #000; }
    
    /* AI Indicators */
    .ai-indicators { display: flex; gap: 12px; margin-top: 12px; }
    .ai-indicator {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
    }
    .ai-indicator--cumplimiento { background: rgba(52,199,89,0.1); }
    .ai-indicator--riesgo-bajo { background: rgba(52,199,89,0.1); border: 1px solid #34C759; }
    .ai-indicator--riesgo-medio { background: rgba(255,204,0,0.1); border: 1px solid #FFCC00; }
    .ai-indicator--riesgo-alto { background: rgba(255,59,48,0.1); border: 1px solid #FF3B30; }
    .ai-indicator__value { font-size: 20px; font-weight: 700; }
    .ai-indicator--cumplimiento .ai-indicator__value { color: #34C759; }
    .ai-indicator--riesgo-bajo .ai-indicator__value { color: #34C759; }
    .ai-indicator--riesgo-medio .ai-indicator__value { color: #FFCC00; }
    .ai-indicator--riesgo-alto .ai-indicator__value { color: #FF3B30; }
    .ai-indicator__label { font-size: 11px; color: #8E8E93; margin-top: 4px; }
    
    /* Recommendations */
    .recommendations { margin-top: 12px; }
    .recommendation {
      padding: 8px 12px;
      background: #FFF9E6;
      border-left: 3px solid #FFCC00;
      border-radius: 4px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    
    /* Achievements */
    .achievements { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
    .achievement {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #F2F2F7;
      border-radius: 8px;
      font-size: 13px;
    }
    .achievement__icon { font-size: 20px; }
    .achievement__info { display: flex; flex-direction: column; }
    .achievement__name { font-weight: 500; font-size: 12px; }
    .achievement__date { font-size: 11px; color: #8E8E93; }
    
    /* Menu bar extra */
    .menu-bar__dropdown { position: relative; }
    .menu-bar__menu {
      position: absolute;
      top: 100%;
      left: 0;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      min-width: 180px;
      padding: 4px 0;
      display: none;
      z-index: 1000;
    }
    .menu-bar__menu--open { display: block; }
    .menu-bar__menu-item { 
      padding: 8px 16px; 
      cursor: pointer; 
      font-size: 13px; 
    }
    .menu-bar__menu-item:hover { background: rgba(0,0,0,0.05); }
    .menu-bar__menu-separator { height: 1px; background: #E5E5EA; margin: 4px 0; }
    
    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .modal-overlay--open { opacity: 1; pointer-events: all; }
    .modal {
      background: white;
      border-radius: 16px;
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      transform: scale(0.9);
      transition: transform 0.3s;
    }
    .modal-overlay--open .modal { transform: scale(1); }
    .modal-header {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      align-items: center;
    }
    .modal-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg,#007AFF,#5856D6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 28px;
    }
    .modal-header-info { flex: 1; }
    .modal-title { font-size: 24px; font-weight: 700; }
    .modal-subtitle { font-size: 14px; color: #8E8E93; margin-top: 4px; }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #E5E5EA;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-section { margin-bottom: 20px; }
    .modal-section-title {
      font-size: 12px;
      font-weight: 600;
      color: #8E8E93;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .modal-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .modal-field {
      padding: 8px 12px;
      background: #F2F2F7;
      border-radius: 8px;
    }
    .modal-field__label { font-size: 11px; color: #8E8E93; }
    .modal-field__value { font-size: 14px; font-weight: 500; margin-top: 2px; }
    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      justify-content: flex-end;
    }
  </style>
</head>

  <!-- Menu Bar -->
  <header class="menu-bar">

          <div class="menu-bar__menu-item" onclick="document.execCommand('undo');closeMenus()">Deshacer</div>
          <div class="menu-bar__menu-item" onclick="document.execCommand('redo');closeMenus()">Rehacer</div>
          <div class="menu-bar__menu-separator"></div>
          <div class="menu-bar__menu-item" onclick="document.execCommand('cut');closeMenus()">Cortar</div>
          <div class="menu-bar__menu-item" onclick="document.execCommand('copy');closeMenus()">Copiar</div>
          <div class="menu-bar__menu-item" onclick="document.execCommand('paste');closeMenus()">Pegar</div>

      <!-- Ver dropdown -->
      <div class="menu-bar__dropdown">
        <a href="#" id="menu-ver" style="cursor:pointer;">Ver</a>

      </div>

      <div class="menu-bar__dropdown">
        <a href="#" id="menu-ayuda" style="cursor:pointer;">Ayuda</a>

      </button>
      <div class="menu-bar__right-avatar" id="user-avatar">MG</div>
      <div class="menu-bar__time" id="clock">10:30</div>

  </header>

  <main class="page" style="padding-bottom: 80px;">
    <aside class="sidebar">
      <!-- Search -->
      <div class="search">
        <input type="text" placeholder="Buscar psicologos..." id="search-input">
      </div>
      
      <!-- Status filters -->

        </div>

      <!-- Psychologist list -->

    <!-- Detail panel -->
    <section class="main" id="psi-detail">

    // === RENDERIZADO DE EQUIPOS ===
    function renderTeams() {
      var teamList = document.getElementById('team-list');
      if (!teamList) return;
      teamList.innerHTML = '';
      
      for (var i = 0; i < teams.length; i++) {
        var team = teams[i];
        var count = 0;
        for (var j = 0; j < psicologos.length; j++) {
          if (psicologos[j].equipo === team.id) count++;
        }
        
        var div = document.createElement('div');
        div.className = 'team-item';
        if (currentTeam === team.id) div.className += ' team-item--active';
        
        div.innerHTML = '<span>' + team.name + '</span><span class="team-count">' + count + '</span>';
        
        (function(teamId) {
          div.addEventListener('click', function() {
            currentTeam = currentTeam === teamId ? null : teamId;
            renderTeams();
            filterAndRender();
            var filters = document.querySelectorAll('.filter');
            for (var k = 0; k < filters.length; k++) {
              filters[k].classList.remove('filter--active');
            }
            var todosFilter = document.querySelector('[data-filter="todos"]');
            if (todosFilter) todosFilter.classList.add('filter--active');
          });
        })(team.id);
        
        teamList.appendChild(div);
      }
    }

    // === FILTRADO Y RENDERIZADO DE LISTA ===
    function filterAndRender() {
      filteredList = [];
      for (var i = 0; i < psicologos.length; i++) {
        filteredList.push(psicologos[i]);
      }
      
      // Filter by status
      if (currentFilter !== 'todos') {
        var tempList = [];
        for (var i = 0; i < filteredList.length; i++) {
          if (filteredList[i].status === currentFilter) tempList.push(filteredList[i]);
        }
        filteredList = tempList;
      }
      
      // Filter by team
      if (currentTeam) {
        var tempList = [];
        for (var i = 0; i < filteredList.length; i++) {
          if (filteredList[i].equipo === currentTeam) tempList.push(filteredList[i]);
        }
        filteredList = tempList;
      }
      
      renderList();
      
      // Select first if available
      if (filteredList.length > 0) {
        selectPsi(filteredList[0].id);
      } else {
        var detail = document.getElementById('psi-detail');
        if (detail) detail.innerHTML = '';
      }
    }

    function renderList() {
      var list = document.getElementById('psi-list');
      if (!list) return;
      list.innerHTML = '';
      
      if (filteredList.length === 0) {
        list.innerHTML = '<div style="padding:24px;text-align:center;color:#8E8E93;">No se encontraron psicologos</div>';
        return;
      }
      
      // Group by first letter
      var grouped = {};
      for (var i = 0; i < filteredList.length; i++) {
        var p = filteredList[i];
        var letter = p.nombre.charAt(0);
        if (!grouped[letter]) grouped[letter] = [];
        grouped[letter].push(p);
      }
      
      var keys = Object.keys(grouped).sort();
      for (var k = 0; k < keys.length; k++) {
        var letter = keys[k];
        // Section header
        var section = document.createElement('div');

    // === BUSQUEDA ===
    function search(text) {
      text = text.toLowerCase();
      filteredList = [];
      for (var i = 0; i < psicologos.length; i++) {
        var p = psicologos[i];
        var searchText = p.nombre.toLowerCase() + ' ' + p.especialidad.toLowerCase() + ' ' + p.region.toLowerCase() + ' ' + p.municipio.toLowerCase() + ' ' + p.universidad.toLowerCase();
        if (searchText.indexOf(text) !== -1) {
          filteredList.push(p);
        }
      }
      renderList();
      if (filteredList.length > 0) {
        selectPsi(filteredList[0].id);
      }
    }

    // === EXPORTAR LISTA ===
    function exportarLista() {
      var csv = 'Nombre,Especialidad,Universidad,Region,Equipo,Estado\n';
      for (var i = 0; i < psicologos.length; i++) {
        var p = psicologos[i];
        var estado = 'Desconectado';
        if (p.status === 'online') estado = 'En linea';
        else if (p.status === 'away') estado = 'Ausente';
        
        csv += '"' + p.nombre + '","' + p.especialidad + '","' + p.universidad + '","' + (p.region||'') + '","' + (p.equipo||'') + '","' + estado + '"\n'; 
      }
      var blob = new Blob([csv], {type:'text/csv'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); 
      a.href = url; 
      a.download = 'psicologos_' + new Date().toISOString().split('T')[0] + '.csv'; 
      a.click();
      URL.revokeObjectURL(url);
    }

    // === EXPORTAR CON MODAL ===
    function ejecutarExportar() {
      var formato = document.getElementById('export-formato').value;
      var region = document.getElementById('export-region').value;
      var lista = region ? psicologos.filter(function(p) { return p.region === region; }) : psicologos;
      var fecha = new Date().toISOString().split('T')[0];
      var nombre = region ? 'psicologos_' + region + '_' + fecha : 'psicologos_todos_' + fecha;
      
      if (formato === 'xlsx') {
        exportarExcel(lista, nombre + '.xlsx');
      } else if (formato === 'imprimir') {
        window.print();
      } else {
        exportarPDF(lista, nombre + '.pdf');
      }
      closeModal('modal-exportar');
    }

    function exportarExcel(lista, filename) {
      var data = lista.map(function(p) {
        return {
          'Nombre': p.nombre,
          'Especialidad': p.especialidad,
          'Universidad': p.universidad,
          'Telefono': p.telefono,
          'Email': p.email,
          'Cedula': p.cedula,
          'Region': p.region,
          'Municipio': p.municipio,
          'Equipo': p.equipo,
          'Estado': p.status === 'online' ? 'En linea' : (p.status === 'away' ? 'Ausente' : 'Desconectado'),
          'AnoEgreso': p.anoEgreso,
          'AnosExperiencia': p.anosExperiencia,
          'Maestria': p.maestria,
          'Doctorado': p.doctorado,
          'Tipo': p.tipo,
          'Nivel': p.nivel,
          'XP': p.xp,
          'Tokens': p.tokens,
          'Racha': p.racha,
          'Escuelas': p.escuelas,
          'Visitas': p.visitas,
          'Rating': p.rating,
          'Cumplimiento': p.cumplimiento + '%',
          'RiesgoRezago': p.riesgoRezago,
          'Recomendaciones': (p.recomendaciones || []).join('; ')
        };
      });
      var ws = XLSX.utils.json_to_sheet(data);
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Psicologos');
      XLSX.writeFile(wb, filename);
    }

    function exportarPDF(lista, filename) {
      var doc = new jspdf.jsPDF();
      var y = 20;
      doc.setFontSize(16);
      doc.text('Lista de Psicologos', 105, y, { align: 'center' });
      y += 15;
      doc.setFontSize(9);
      var headers = ['Nombre', 'Especialidad', 'Region', 'Estado'];
      var cols = [60, 40, 35, 25];
      var x = 5;
      for (var i = 0; i < headers.length; i++) {
        doc.text(headers[i], x, y);
        x += cols[i];
      }
      y += 5;
      for (var i = 0; i < lista.length; i++) {
        if (y > 270) { doc.addPage(); y = 20; }
        x = 5;
        var p = lista[i];
        var estado = p.status === 'online' ? 'En linea' : (p.status === 'away' ? 'Ausente' : 'Desconectado');
        var row = [p.nombre.substring(0,25), p.especialidad.substring(0,15), p.region.substring(0,12), estado.substring(0,8)];
        for (var j = 0; j < row.length; j++) {
          doc.text(String(row[j]), x, y);
          x += cols[j];
        }
        y += 7;
      }
      doc.save(filename);
    }

        nombre: nombre,
        cedula: cedula,
        especialidad: especialidad,
        universidad: document.getElementById('new-psi-universidad').value,
        telefono: document.getElementById('new-psi-telefono').value,
        email: document.getElementById('new-psi-email').value,
        region: document.getElementById('new-psi-region').value,
        municipio: document.getElementById('new-psi-municipio').value || document.getElementById('new-psi-region').value,
        equipo: document.getElementById('new-psi-equipo').value,
        avatar: avatar,
        foto: fotoUrl,
        status: 'offline',
        nivel: 1, 
        xp: 0, 
        tokens: 0, 
        racha: 0,
        escuelas: 0,
        visitas: 0,
        rating: 0,
        tipo: document.getElementById('new-psi-tipo').value || 'Base',
        maestria: document.getElementById('new-psi-maestria').value || '',
        doctorado: document.getElementById('new-psi-doctorado').value || '',
        anoEgreso: parseInt(document.getElementById('new-psi-ano-egreso').value) || new Date().getFullYear(),
        anosExperiencia: parseInt(document.getElementById('new-psi-experiencia').value) || 0,
        cumplimiento: 0,
        riesgoRezago: 'alto',
        recomendaciones: ['Nuevo psicologo - por evaluar'],
        logros: []
      };
      
      psicologos.push(nuevo); 
      filterAndRender(); 
      closeModal('modal-nuevo-psi'); 
      alert('Psicologo guardado correctamente');
    }

    // === INICIALIZACION ===
    document.addEventListener('DOMContentLoaded', function() {
      // DEBUG: Check syncStore availability
      console.log('DEBUG: syncStore available?', typeof syncStore);
      console.log('DEBUG: syncStore.get(logged) =', syncStore.get('logged'));
      // Check session
      if (syncStore.get('logged') !== 'true') {
        navigateTo('../login.html');
        return;
      }
      
      // User info
      var usuario = syncStore.get('usuario') || 'Usuario';
      var avatarEl = document.getElementById('user-avatar');
      var storedAvatar = syncStore.get('avatar_image') || localStorage.getItem('sep_avatar_image');
      if (avatarEl) {
        if (storedAvatar) {
          avatarEl.style.backgroundImage = 'url(' + storedAvatar + ')';
          avatarEl.style.backgroundSize = 'cover';
          avatarEl.style.backgroundPosition = 'center';
          avatarEl.textContent = '';
        } else {
          var iniciales = usuario.split(' ').map(function(n) { return n[0]; }).join('').substring(0,2);
          avatarEl.textContent = iniciales;
        }
      }
      
      // Escuchar cambios de avatar desde perfil
      window.addEventListener('avatar-updated', function() {
        var storedAvatar = localStorage.getItem('sep_avatar_image');
        if (storedAvatar && avatarEl) {
          avatarEl.style.backgroundImage = 'url(' + storedAvatar + ')';
          avatarEl.style.backgroundSize = 'cover';
          avatarEl.style.backgroundPosition = 'center';
          avatarEl.textContent = '';
        }
      });
      
      // Logout
      var logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) logoutBtn.addEventListener('click', logout);
      
      // Dock navigation
      var dockIcons = document.querySelectorAll('.dock__icon');
      for (var i = 0; i < dockIcons.length; i++) {
        (function(icon) {
          icon.addEventListener('click', function() {
            var href = icon.dataset.href;
            if (href) navigateTo(href);
          });
        })(dockIcons[i]);
      }
      
      // Search
      var searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.addEventListener('input', function(e) {
          search(e.target.value);
        });
      }
      
      // Filters
      var filters = document.querySelectorAll('.filter');
      for (var i = 0; i < filters.length; i++) {
        (function(filter) {
          filter.addEventListener('click', function() {
            var allFilters = document.querySelectorAll('.filter');
            for (var j = 0; j < allFilters.length; j++) {
              allFilters[j].classList.remove('filter--active');
            }
            filter.classList.add('filter--active');
            currentFilter = filter.dataset.filter;
            currentTeam = null;
            renderTeams();
            filterAndRender();
          });
        })(filters[i]);
      }
      
      // Render teams and list
      renderTeams();
      filterAndRender();
      
      // Clock
      var clockEl = document.getElementById('clock');
      if (clockEl) {
        setInterval(function() {
          clockEl.textContent = new Date().toLocaleTimeString('es-MX', {hour:'2-digit',minute:'2-digit'});
        }, 1000);
      }
      
      // Menu bar dropdowns
      var menus = ['archivo', 'editar', 'ver', 'ayuda'];
      for (var i = 0; i < menus.length; i++) {
        (function(menuName) {
          var btn = document.getElementById('menu-' + menuName);
          var dropdown = document.getElementById('dropdown-' + menuName);
          if (btn && dropdown) {
            btn.addEventListener('click', function(e) {
              e.preventDefault();
              var isOpen = dropdown.classList.contains('menu-bar__menu--open');
              closeMenus();
              if (!isOpen) dropdown.classList.add('menu-bar__menu--open');
            });
          }
        })(menus[i]);
      }
      
      document.addEventListener('click', function(e) {
        if (!e.target.closest('.menu-bar__dropdown')) {
          closeMenus();
        }
      });

      // Close modal on overlay click
      var profileModal = document.getElementById('profile-modal');
      if (profileModal) {
        profileModal.addEventListener('click', function(e) {
          if (e.target === profileModal) {
            closeProfileModal();
          }
        });
      }

      // Close modal on Escape key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          closeProfileModal();
        }
      });
    });
  </script>
